<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decoding Part 107 Practice Quizzes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Decoding Part 107 Practice Quizzes</h1>
      <p class="intro">
        This pilot quiz pulls a random set of METAR practice questions and gives immediate feedback.
        Scores are not saved.
      </p>
    </header>

    <section class="card" id="start-screen">
      <h2>METAR Practice Pilot</h2>
      <p>
        This quiz will randomly select <strong>3 questions</strong> from a small METAR question bank.
      </p>
      <button id="start-button">Start Quiz</button>
    </section>

    <section class="card hidden" id="quiz-screen">
      <h2 id="quiz-title">METAR Practice</h2>
      <form id="quiz-form"></form>
      <button id="submit-button">Submit Quiz</button>
    </section>

    <section class="card hidden" id="results-screen">
      <h2>Results</h2>
      <p id="score-summary"></p>
      <div id="feedback"></div>
      <button id="restart-button">Try Another Random Version</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
